<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>標籤條碼檢查（純網頁版）</title>
<style>
*{box-sizing:border-box}
body{font-family:"Microsoft JhengHei","Segoe UI",sans-serif;margin:0;background:#f4f6f8;color:#1f2933;line-height:1.65}
header{background:#1f3a5f;color:#fff;padding:14px 24px}
header h1{margin:0;font-size:19px}
header p{margin:2px 0 0;opacity:.85;font-size:13px}
.wrap{max-width:1500px;margin:0 auto;padding:18px 22px 70px}
#drop{border:3px dashed #b6c2d1;border-radius:14px;background:#fff;padding:30px 18px;text-align:center;cursor:pointer}
#drop.hot{border-color:#1f3a5f;background:#eef4ff}
#drop .big{font-size:16px;font-weight:700}
#drop .sm{font-size:13px;color:#64748b;margin-top:4px}
.bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:14px 0}
.bar label{font-size:14px}
.bar input[type=number]{width:110px;padding:6px 8px;border:1px solid #cbd5e1;border-radius:6px;font-size:14px}
button{padding:8px 16px;border:0;border-radius:7px;background:#1f3a5f;color:#fff;font-size:14px;cursor:pointer}
button.ghost{background:#fff;color:#1f3a5f;border:1px solid #c3cedd}
#status{margin:10px 0;font-size:14px;color:#475569;min-height:22px}
.verdict{border-radius:12px;padding:14px 18px;font-size:17px;font-weight:700;margin:14px 0}
.verdict.ok{background:#e7f7ec;border:1px solid #86d79b;color:#0a7d32}
.verdict.warn{background:#fff7e6;border:1px solid #ffd591;color:#ad6800}
.verdict.bad{background:#fdecec;border:1px solid #f3a9a9;color:#b00020}
.verdict .sub{display:block;font-size:13px;font-weight:400;margin-top:4px;color:#475569}
.warns{background:#fff7e6;border:1px solid #ffd591;border-radius:8px;padding:10px 16px;font-size:13.5px;margin:12px 0}
.warns li{margin:3px 0}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;margin:16px 0;overflow:hidden}
.card h3{margin:0;padding:11px 16px;font-size:15px;border-bottom:1px solid #eef2f6;background:#fbfcfd}
table{border-collapse:collapse;width:100%}
th,td{border-top:1px solid #eef2f6;padding:9px 10px;font-size:13px;vertical-align:top;text-align:left}
th{background:#f8fafc;font-size:12px;color:#64748b;white-space:nowrap}
.mono{font-family:Consolas,monospace;font-size:14.5px;letter-spacing:.6px;white-space:nowrap}
.mono b{color:#b00020}
td img{display:block;width:100%;max-width:260px;border:1px solid #eef2f6;border-radius:4px;cursor:zoom-in}
td.cmp img{max-width:430px}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12.5px;font-weight:700;white-space:nowrap}
.t-ok{background:#e7f7ec;color:#0a7d32}
.t-ng{background:#fdecec;color:#b00020}
.t-ck{background:#fff4e0;color:#ad6800}
.why{font-size:12.5px;color:#475569;max-width:330px}
.why .weak{color:#ad6800}
.hint{color:#64748b;font-size:12px}
.ovw img{width:100%;max-width:100%;border:0;border-radius:0;cursor:zoom-in}
dialog{border:0;border-radius:10px;padding:0;max-width:96vw;max-height:96vh;background:#fff}
dialog img{display:block;max-width:94vw;max-height:92vh}
dialog::backdrop{background:rgba(15,23,42,.75)}
.legend{font-size:12.5px;color:#475569;padding:8px 16px;background:#fbfcfd;border-top:1px solid #eef2f6}
.sw{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin:0 3px 0 10px}
.fail{background:#fdecec;border:1px solid #f3a9a9;border-radius:12px;padding:16px 20px;font-size:14px}
.fail h3{margin:0 0 8px;font-size:17px;color:#b00020;padding:0;border:0;background:none}
.fail p{margin:0}
.fail code{background:#fff;border:1px solid #f0cccc;border-radius:4px;padding:1px 5px;font-size:13px}
.fail a{color:#1f3a5f}
@media print{
  header,#drop,.bar,#status,button{display:none!important}
  body{background:#fff}
  tr{break-inside:avoid}
  .ovw{break-before:page}
}
</style>
</head>
<body>
<header>
  <h1>🏷️ 標籤條碼檢查</h1>
  <p>條碼解碼 × 兩次 OCR × 字形覆核 × 模板疊合比對——全部在你的瀏覽器裡跑，檔案不會上傳到任何地方</p>
</header>
<div class="wrap">

  <div id="drop">
    <div class="big">把標籤 PDF（或掃描／拍照的圖檔）拖到這裡</div>
    <div class="sm">也可以點一下選檔　·　第一次開啟要下載約 24MB 的程式與辨識模型（之後瀏覽器會自己留著，不必再下載）</div>
  </div>
  <input id="picker" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp" hidden>

  <div class="bar">
    <label>這份稿應該有幾個條碼：<input id="expect" type="number" min="1" step="1" placeholder="選填"></label>
    <span class="hint">填了才算「總數已核對」——不填的話，整批少印一個條碼程式是看不出來的。</span>
    <button id="print" class="ghost" hidden>列印／存成 PDF</button>
  </div>

  <div id="status"></div>
  <div id="out"></div>
</div>

<dialog id="zoom"><img id="zoomimg" alt=""></dialog>

<!--
  這一段是「普通 script」，不是 module，而且刻意放在程式本體之前。
  介面的事件綁定絕對不能排在任何 import 後面：module script 只要相依裡有一個載不到，
  整段就不會執行，畫面看起來好好的，但點了沒反應、拖了也沒反應，而且完全不報錯。
  （初版就是這樣寫的，踩過。）現在按鈕先能動，程式再慢慢載；載不到就講出來。
-->
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var drop = $('#drop'), picker = $('#picker'), status = $('#status');
  var state = { ready: false, failed: null, queued: null, run: null };
  window.__ui = state;

  function say(html, bad) {
    status.innerHTML = bad ? '<b style="color:#b00020">' + html + '</b>' : html;
  }

  function take(file) {
    if (!file) return;
    if (state.failed) { say(state.failed, true); return; }
    if (!state.ready) {                       // 還在載：先收下，載完自動接著跑
      state.queued = file;
      say('程式還在載入中，收到「' + file.name + '」了，載完會自動開始…');
      return;
    }
    state.run(file);
  }
  state.take = take;

  drop.addEventListener('click', function () { picker.click(); });
  picker.addEventListener('change', function (e) { take(e.target.files[0]); });
  ['dragenter', 'dragover'].forEach(function (t) {
    drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('hot'); });
  });
  ['dragleave', 'dragend'].forEach(function (t) {
    drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('hot'); });
  });
  drop.addEventListener('drop', function (e) {
    e.preventDefault();
    drop.classList.remove('hot');
    take(e.dataTransfer.files[0]);
  });
  // 掉在框外面的話，瀏覽器預設會直接把 PDF 開起來、把這一頁蓋掉——擋掉並提示
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) {
    e.preventDefault();
    if (!drop.contains(e.target)) say('請把檔案放在上面那個虛線框裡。');
  });

  $('#print').addEventListener('click', function () { window.print(); });
  $('#zoom').addEventListener('click', function () { $('#zoom').close(); });
  $('#out').addEventListener('click', function (e) {
    if (e.target.tagName === 'IMG') { $('#zoomimg').src = e.target.src; $('#zoom').showModal(); }
  });

  say('載入中…');
  // 載入本身失敗時要看得見。最常見的兩種：用 file:// 直接開檔（模組會被瀏覽器擋下），
  // 以及網路／擴充套件把檔案擋掉。
  state.fail = function (err) {
    var msg = String((err && err.message) || err || '未知錯誤');
    var isFile = location.protocol === 'file:';
    var hint = isFile
      ? '<b>這一頁不能用「直接開啟檔案」的方式跑。</b>瀏覽器基於安全性，'
        + '不允許 <code>file://</code> 的頁面載入 JS 模組，所以程式整個載不起來。<br><br>'
        + '<b>兩個解法，挑一個：</b>'
        + '<ol style="margin:6px 0 0;padding-left:22px">'
        + '<li>直接用網址開：<a href="https://pokaihsu1243-create.github.io/label-barcode-check/">'
        + 'https://pokaihsu1243-create.github.io/label-barcode-check/</a></li>'
        + '<li>要離線用的話，雙擊這個資料夾裡的 <code>離線啟動.bat</code>（會自己開好瀏覽器）。</li>'
        + '</ol>'
      : '請確認網路正常；若瀏覽器裝了廣告攔截／安全性擴充套件，請對這個網站停用後重新整理。'
        + '若是自己架的站，請確認 <code>js/</code>、<code>vendor/</code>、<code>models/</code> 三個資料夾都有一起放上去。';
    state.failed = '程式載入失敗：' + msg;
    say(state.failed, true);
    // 這是使用者最可能撞到的錯，講在小小的狀態列裡看不到——直接鋪一塊在畫面上
    $('#out').innerHTML = '<div class="fail"><h3>⚠ 程式載入失敗</h3><p>' + hint
      + '</p><p class="hint" style="margin-top:10px">技術細節：' + msg + '</p></div>';
    $('#drop').style.display = 'none';
  };
  window.addEventListener('error', function (e) {
    if (!state.ready && e.target && e.target.tagName === 'SCRIPT') state.fail('指令碼載不到');
  }, true);
})();
</script>

<script type="module">
const ui = window.__ui;
let check, DPI, DPI_HI;
try {
  ({ check, DPI, DPI_HI } = await import('./js/app.js'));
} catch (err) {
  ui.fail(err);
  throw err;
}

const $ = s => document.querySelector(s);
const out = $('#out'), status = $('#status');

const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/** 逐字比對，不同的位置標紅——讓人一眼看出是哪一個字錯。 */
function diff(a, b) {
  a = a || ''; b = b || '';
  let s = '';
  for (let i = 0; i < Math.max(a.length, b.length); i++) {
    const c = i < a.length ? a[i] : '·';
    s += (c === (i < b.length ? b[i] : '·')) ? esc(c) : '<b>' + esc(c) + '</b>';
  }
  return s;
}

const TAG = { OK: ['t-ok', 'OK'], NG: ['t-ng', 'NG'], NOTEXT: ['t-ck', '讀不到字'] };

let busy = false;
async function run(file) {
  if (busy) return;
  busy = true;
  out.innerHTML = '';
  $('#print').hidden = true;
  const expect = parseInt($('#expect').value, 10);
  try {
    const t0 = performance.now();
    const res = await check(file, Number.isInteger(expect) && expect > 0 ? expect : null,
                            m => { status.textContent = m; });
    status.textContent = `完成：共 ${res.rows.length} 個條碼，字形覆核分出 ${res.nclu} 種字形，`
      + `耗時 ${((performance.now() - t0) / 1000).toFixed(1)} 秒`;
    report(res, file.name);
    $('#print').hidden = false;
  } catch (err) {
    status.innerHTML = `<b style="color:#b00020">出錯了：${esc(err.message || err)}</b>`;
    console.error(err);
  } finally {
    busy = false;
  }
}

function report(res, name) {
  const s = res.summary;
  const html = [];
  html.push(`<div class="verdict ${s.level}">${esc(s.text)}
    <span class="sub">${esc(name)}　·　共 ${res.rows.length} 個條碼　·　NG ${s.ng} 個　·　待確認 ${s.chk} 個
    　·　解析度 ${DPI}／${DPI_HI} dpi</span></div>`);

  if (res.warns.length)
    html.push('<div class="warns"><b>需要注意：</b><ul>'
      + res.warns.map(w => `<li>${esc(w)}</li>`).join('') + '</ul></div>');

  html.push(`<div class="card"><h3>逐個條碼的核對結果</h3><table>
    <tr><th>頁／標籤</th><th>條碼解出</th><th>印刷數字<br><span class="hint">OCR</span></th>
        <th>判定</th><th>說明</th><th>原圖</th><th>疊合對照</th></tr>`);
  for (const r of res.rows) {
    const [cls, label] = TAG[r.verdict] || ['t-ck', '待確認'];
    const note = r.tplNote
      ? `<div class="${r.tplNote.weak ? 'weak' : ''}">${r.tplNote.bad ? '⚠ ' : '✓ '}${esc(r.tplNote.text)}</div>`
      : '';
    html.push(`<tr>
      <td class="hint">第 ${r.page} 頁${r.label > 0 ? `<br>第 ${r.label} 張` : ''}${r.orient ? `<br>${r.orient}°` : ''}</td>
      <td class="mono">${diff(r.bc, r.ocr)}</td>
      <td class="mono">${diff(r.ocr, r.bc)}<div class="hint">信心 ${r.score.toFixed(2)}</div></td>
      <td><span class="tag ${cls}">${label}</span></td>
      <td class="why">${esc(r.reason)}${note}</td>
      <td>${r.img ? `<img src="${r.img}" alt="原圖">` : ''}</td>
      <td class="cmp">${r.cmp ? `<img src="${r.cmp}" alt="疊合對照">` : '<span class="hint">—</span>'}</td>
    </tr>`);
  }
  html.push(`</table><div class="legend">
    <b>疊合對照怎麼看：</b>紅字＝條碼解出的內容，藍字＝OCR 讀到的字，直接疊在印刷字上，對得起來就是形狀重合。
    <span class="sw" style="background:#d60000"></span>紅框＝模板比對認定與條碼不符
    <span class="sw" style="background:#e69100"></span>橘框＝程式自己也不確定的字，請人眼複查。
  </div></div>`);

  for (const ov of res.overviews)
    html.push(`<div class="card ovw"><h3>原圖對照頁（第 ${ov.no} 頁）
      <span class="hint">——在每個印刷數字正下方補上條碼解出的數字，方向跟著標籤走</span></h3>
      <img src="${ov.img}" alt="原圖對照"></div>`);

  out.innerHTML = html.join('');
}

// 到這裡才算真的可以用了。載入期間有人先丟了檔案的話，現在接著跑。
ui.ready = true;
ui.run = run;
status.textContent = '就緒——把標籤稿拖進上面的框，或點一下選檔。';
if (ui.queued) {
  const f = ui.queued;
  ui.queued = null;
  run(f);
}

window.__check = check;      // 給自動化測試用
</script>
</body>
</html>
